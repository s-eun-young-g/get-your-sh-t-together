# fly.io config. `fly launch` will ask for a globally unique app name and
# keep this file; the volume holds the SQLite database across deploys.

primary_region = "bos"

[build]

[env]
  STRATA_DATA_DIR = "/data"

[mounts]
  source = "strata_data"
  destination = "/data"

[http_service]
  internal_port = 8020
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
