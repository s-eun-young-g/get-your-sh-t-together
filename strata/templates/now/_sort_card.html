{% if task %}
<div class="card blitz-card">
  <p class="blitz-title">{{ task['title'] }}</p>
  {% if task['source'] %}<p class="age">from {{ task['source'] }}</p>{% endif %}
  <div class="row actions">
    <button hx-post="/now/tasks/{{ task['id'] }}/move" hx-vals='{"horizon":"today","frame":"sort"}' hx-target="#sort">today</button>
    <button class="quiet" hx-post="/now/tasks/{{ task['id'] }}/nuisance" hx-vals='{"frame":"sort"}' hx-target="#sort">frog</button>
    {% for w in workspaces %}
    <button class="quiet" hx-post="/now/tasks/{{ task['id'] }}/sort_tag" hx-vals='{"workspace_id": {{ w['id'] }}}' hx-target="#sort">{{ w['name'] }}</button>
    {% endfor %}
    <button class="quiet" hx-post="/now/tasks/{{ task['id'] }}/skip" hx-target="#sort">skip</button>
    <button class="quiet danger" hx-post="/now/tasks/{{ task['id'] }}/delete" hx-vals='{"frame":"sort"}' hx-target="#sort">drop</button>
  </div>
  <p class="momentum">{{ remaining }} in the inbox</p>
</div>
{% else %}
<div class="card blitz-card">
  <p class="blitz-title">inbox zero.</p>
  <p><a class="quiet-link" href="/">back home</a></p>
</div>
{% endif %}
